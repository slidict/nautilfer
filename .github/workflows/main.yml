name: Ruby

on:
  push:
    branches:
      - master

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          # Matches required_ruby_version in the gemspec, which is the floor this
          # gem supports. 3.5 was abandoned - the only thing ever published for it
          # is 3.5.0-preview1, which ruby-builder has no binary for on any runner
          # image - and the line went to 4.0 instead.
          - '4.0'

    steps:
    - uses: actions/checkout@v3

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true

    - name: Run the rspec.
      run: bundle exec rspec
