name: Ruby

on:
  push:
    branches:
      - master

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          # Matches required_ruby_version in the gemspec, which is the floor this
          # gem supports. 3.5 was abandoned - the only thing ever published for it
          # is 3.5.0-preview1, which ruby-builder has no binary for on any runner
          # image - and the line went to 4.0 instead.
          - '4.0'

    steps:
    - uses: actions/checkout@v3

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true

    - name: Run the rspec.
      run: bundle exec rspec

  dev-container:
    runs-on: ubuntu-latest
    name: Dev container runs as the host user
    # Checkout and a local docker build are all this job does.
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4

    - name: Build with a UID supplied
      run: env UID=$(id -u) docker compose build app

    - name: A container write is owned by the host user, not root
      run: |
        env UID=$(id -u) docker compose run --rm -T app \
          sh -c 'id -u; id -un; touch /app/ci-owner-probe'
        stat -c '%u %n' ci-owner-probe
        test "$(stat -c %u ci-owner-probe)" = "$(id -u)"
        rm -f ci-owner-probe

    - name: bundle install works as the non-root user
      run: env UID=$(id -u) docker compose run --rm -T app bundle install

    - name: Build with no UID in the environment, and still get the account
      # A green build proves nothing here: the defect being fixed -- a skipped
      # useradd, a missing USER -- builds successfully. Assert the uid instead.
      run: |
        docker compose build app
        test "$(docker compose run --rm -T app id -u)" = "1000"
        test "$(docker compose run --rm -T app id -un)" = "user"
