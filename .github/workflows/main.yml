name: Ruby

on:
  push:
    branches:
      - master

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          # 3.5 resolves to a preview that ruby-builder has no binary for, on any
          # runner image. Re-add it once 3.5.0 is released; the gemspec floor is 3.4.
          - '3.4'

    steps:
    - uses: actions/checkout@v3

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true

    - name: Run the rspec.
      run: bundle exec rspec
