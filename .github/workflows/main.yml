name: Ruby

on:
  push:
    branches:
      - master

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          # 3.5 was abandoned: the only thing ever published for it is
          # 3.5.0-preview1, which ruby-builder has no binary for on any runner
          # image, and the line went to 4.0 instead. 3.4 is the gemspec floor and
          # 4.0 is what the one consumer of this gem runs.
          - '3.4'
          - '4.0'

    steps:
    - uses: actions/checkout@v3

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true

    - name: Run the rspec.
      run: bundle exec rspec
